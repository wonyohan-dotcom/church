# 심플한교회관리 — 교회 사무실 PC, NAS, 일반 서버에서 실행할 때 쓰는 설정입니다.
#
#   1. APP_SECRET 을 아래에 채웁니다 (openssl rand -hex 32)
#   2. docker compose up -d
#   3. 브라우저에서 http://서버주소:3000 접속
#
# Supabase 를 쓰신다면 아래 db 서비스를 지우고 DATABASE_URL 만 Supabase 주소로
# 바꾸면 됩니다. 사진도 Supabase Storage 에 맡기려면 SUPABASE_* 세 값을 채우세요.

services:
  church:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # 반드시 바꿔 주세요. 잃어버리면 저장된 주민등록번호를 읽을 수 없습니다.
      APP_SECRET: "여기에-openssl-rand-hex-32-결과를-붙여넣으세요"
      DATABASE_URL: "postgresql://postgres:changeme@db:5432/church?schema=public"
      TZ: "Asia/Seoul"
      # Supabase Storage 를 쓰려면 아래 주석을 풀고 채우세요.
      # SUPABASE_URL: "https://xxxx.supabase.co"
      # SUPABASE_SERVICE_ROLE_KEY: "..."
      # SUPABASE_BUCKET: "church-uploads"
    volumes:
      # Supabase Storage 를 쓰지 않을 때 사진이 쌓이는 곳
      - church-uploads:/data

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "changeme"
      POSTGRES_DB: church
      TZ: "Asia/Seoul"
    volumes:
      - church-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  church-db:
  church-uploads:
