# 교회 사무실 PC, NAS, 일반 서버에서 실행할 때 쓰는 설정입니다.
#
#   1. APP_SECRET 을 아래에 채웁니다 (openssl rand -hex 32)
#   2. docker compose up -d
#   3. 브라우저에서 http://서버주소:3000 접속
#
# 교회의 모든 자료(데이터베이스 + 사진)는 church-data 볼륨 한 곳에 모입니다.
# 백업은 이 볼륨만 복사하면 됩니다.

services:
  church:
    build: .
    # 직접 빌드하지 않고 미리 만든 이미지를 쓰려면 위 build 대신 image 를 지정하세요.
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 반드시 바꿔 주세요. 잃어버리면 저장된 주민등록번호를 읽을 수 없습니다.
      APP_SECRET: "여기에-openssl-rand-hex-32-결과를-붙여넣으세요"
      DATABASE_URL: "file:/data/church.db"
      UPLOAD_DIR: "/data/uploads"
      TZ: "Asia/Seoul"
    volumes:
      - church-data:/data

volumes:
  church-data:
